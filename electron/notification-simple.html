<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMANTU Notification</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      overflow: hidden;
      width: 380px;
      max-width: 100vw;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .toast {
      margin: 16px;
      background: linear-gradient(135deg, #001a3e 0%, #003d7a 50%, #004a8f 100%);
      border: 1px solid rgba(249, 187, 0, 0.35);
      border-radius: 20px;
      padding: 16px 18px 15px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
      transform: translateX(100%);
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.34, 1.45, 0.64, 1);
    }
    .toast.visible {
      transform: translateX(0);
      opacity: 1;
    }
    .toast.closing {
      transform: translateX(100%);
      opacity: 0;
      transition: all 0.3s ease-in;
    }

    .accent {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #F9BB00, transparent);
      border-radius: 20px 20px 0 0;
    }

    .header { display: flex; gap: 13px; margin-bottom: 10px; }
    .icon { font-size: 24px; }
    .title-wrap { flex: 1; }
    .title {
      font-size: 13px;
      font-weight: 700;
      color: #F9BB00;
    }
    .label {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.32);
      margin-top: 3px;
    }
    .body {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.5;
      word-break: break-word;
    }
    .progress {
      margin-top: 12px;
      height: 2px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 1px;
      overflow: hidden;
    }
    .bar {
      height: 100%;
      background: linear-gradient(90deg, #F9BB00, rgba(249, 187, 0, 0.6));
      animation: drain var(--dur, 5s) linear forwards;
    }
    @keyframes drain { from { width: 100%; } to { width: 0; } }
  </style>
</head>
<body>
  <div class="toast" id="t">
    <div class="accent"></div>
    <div class="header">
      <span class="icon" id="i">🔊</span>
      <div class="title-wrap">
        <div class="title" id="tl">Pengumuman</div>
        <div class="label">SIMANTU</div>
      </div>
    </div>
    <div class="body" id="b">—</div>
    <div class="progress"><div class="bar" id="pb"></div></div>
  </div>

  <script>
    const p = new URLSearchParams(location.search);
    const dur = parseInt(p.get('duration') || '5500', 10);
    
    document.getElementById('i').textContent = p.get('icon') || '🔊';
    document.getElementById('tl').textContent = (p.get('title') || '').replace(/^[🔊⏰]\s*/, '');
    document.getElementById('b').textContent = p.get('body') || '';
    document.getElementById('pb').style.setProperty('--dur', (dur / 1000) + 's');
    
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.getElementById('t').classList.add('visible');
    }));

    setTimeout(() => {
      const t = document.getElementById('t');
      t.classList.remove('visible');
      t.classList.add('closing');
      setTimeout(() => window.close(), 350);
    }, dur - 350);
  </script>
</body>
</html>
