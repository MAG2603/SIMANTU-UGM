<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMANTU Notification</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent;
      overflow: hidden;
      width: 380px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .toast {
      margin: 16px;
      background: linear-gradient(135deg, #001a3e 0%, #003d7a 50%, #004a8f 100%);
      border: 1px solid rgba(249, 187, 0, 0.35);
      border-radius: 20px;
      padding: 16px 18px 15px;
      box-shadow:
        0 32px 80px rgba(0, 0, 0, 0.58),
        0 0 0 1px rgba(249, 187, 0, 0.15),
        inset 0 2px 8px rgba(255, 255, 255, 0.08),
        inset 0 -1px 4px rgba(0, 0, 0, 0.25);
      position: relative;
      overflow: hidden;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      transform: translateX(150%) rotateY(-25deg) scale(0.92);
      opacity: 0;
      transform-origin: right center;
      transition: transform 0.42s cubic-bezier(0.23, 1.55, 0.32, 1), opacity 0.28s ease;
    }
    .toast.visible {
      transform: translateX(0) rotateY(0) scale(1);
      opacity: 1;
    }
    .toast.closing {
      transform: translateX(150%) rotateY(-25deg) scale(0.92);
      opacity: 0;
      transition: transform 0.30s ease-in, opacity 0.24s ease-in;
    }

    /* Animated top accent bar */
    .accent {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #F9BB00, rgba(249,187,0,0.5), rgba(249,187,0,0.1));
      border-radius: 20px 20px 0 0;
      box-shadow: 0 0 16px rgba(249, 187, 0, 0.35);
    }

    /* Shimmer sweep effect */
    .shimmer {
      position: absolute;
      top: -50%; bottom: -50%;
      left: -100%;
      width: 70%;
      background: linear-gradient(45deg, transparent, rgba(249, 187, 0, 0.12), transparent);
      animation: shimmer 3.8s ease-in-out infinite 0.6s;
      pointer-events: none;
      transform: skewX(-20deg);
    }
    @keyframes shimmer {
      from { left: -100%; }
      to   { left: 200%; }
    }

    /* Subtle glow pulse */
    @keyframes glowPulse {
      0%, 100% { box-shadow: 
        0 32px 80px rgba(0, 0, 0, 0.58),
        0 0 0 1px rgba(249, 187, 0, 0.15),
        inset 0 2px 8px rgba(255, 255, 255, 0.08),
        inset 0 -1px 4px rgba(0, 0, 0, 0.25),
        0 0 20px rgba(249, 187, 0, 0); }
      50% { box-shadow:
        0 32px 80px rgba(0, 0, 0, 0.58),
        0 0 0 1px rgba(249, 187, 0, 0.15),
        inset 0 2px 8px rgba(255, 255, 255, 0.08),
        inset 0 -1px 4px rgba(0, 0, 0, 0.25),
        0 0 32px rgba(249, 187, 0, 0.18); }
    }
    .toast.visible { animation: glowPulse 2.6s ease-in-out infinite; }

    .header {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 10px;
    }

    .icon-bg {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, rgba(249, 187, 0, 0.16), rgba(249, 187, 0, 0.08));
      border: 1.5px solid rgba(249, 187, 0, 0.28);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      box-shadow: 
        inset 0 1px 2px rgba(249, 187, 0, 0.12),
        0 0 16px rgba(249, 187, 0, 0.12);
      animation: iconPop 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.28s both;
    }
    @keyframes iconPop {
      0% { transform: scale(0) rotate(-20deg); opacity: 0; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    .title-block { flex: 1; min-width: 0; }
    .title {
      font-size: 13px;
      font-weight: 700;
      color: #F9BB00;
      letter-spacing: 0.02em;
      line-height: 1.3;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
    .app-label {
      font-size: 9px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.32);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-top: 3px;
    }

    .body {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.6;
      padding-left: 57px;
      word-break: break-word;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.2);
    }

    .progress-container {
      margin-top: 12px;
      height: 2.5px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #F9BB00 0%, rgba(249, 187, 0, 0.6) 100%);
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(249, 187, 0, 0.35);
      transform-origin: left;
      animation: drain var(--dur, 5s) linear forwards;
    }
    @keyframes drain {
      from { transform: scaleX(1); }
      to   { transform: scaleX(0); }
    }
  </style>
</head>
<body>
  <div class="toast" id="toast">
    <div class="accent"></div>
    <div class="shimmer"></div>
    <div class="header">
      <div class="icon-bg" id="iconEl">🔊</div>
      <div class="title-block">
        <div class="title" id="titleEl">Pengumuman</div>
        <div class="app-label">SIMANTU</div>
      </div>
    </div>
    <div class="body" id="bodyEl">—</div>
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const icon     = params.get('icon')     || '🔊';
    const title    = params.get('title')    || 'Pengumuman';
    const body     = params.get('body')     || '';
    const dur      = parseInt(params.get('duration') || '5500', 10);

    document.getElementById('iconEl').textContent  = icon;
    document.getElementById('titleEl').textContent = title.replace(/^[🔊⏰]\s*/, '');
    document.getElementById('bodyEl').textContent  = body;
    document.getElementById('progressBar').style.setProperty('--dur', (dur / 1000) + 's');

    // Trigger slide-in + pop animation after paint
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.getElementById('toast').classList.add('visible');
    }));

    // Slide out then close
    setTimeout(() => {
      const t = document.getElementById('toast');
      t.classList.remove('visible');
      t.classList.add('closing');
      setTimeout(() => window.close(), 350);
    }, dur - 380);
  </script>
</body>
</html>
